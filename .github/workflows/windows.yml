name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Layout and pacing policy tests
        shell: pwsh
        run: dotnet run --project platforms/windows/tests/LayoutTests/LayoutTests.csproj -c Release
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/release/package-weekly.ps1 -Tag v1.1.0
      - name: Reset signal policy tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/package-*/publish/CodexWeeklyPetHud.exe | Select-Object -First 1
          $output = Join-Path $PWD 'artifacts/reset-tests'
          $test = Start-Process $exe.FullName -ArgumentList @('--reset-self-test', ('"' + $output + '"')) -Wait -PassThru
          Get-Content (Join-Path $output 'result.txt')
          if ($test.ExitCode -ne 0) { throw 'Reset signal tests failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
